allowBuilds:
  simple-git-hooks: true

autoDedupe: true

autoInstallPeers: false

color: always

engineStrict: true

gitChecks: false

minimumReleaseAgeExclude:
  - '@standard-config/*'
  - '@typescript/*'
  - typescript

overrides:
  '@prettier/plugin-oxc': '-'

strictPeerDependencies: true

trustPolicy: no-downgrade
