autoDedupe: true

autoInstallPeers: false

color: always

gitChecks: false

lockfile:
  includeResolutionSettings: true

minimumReleaseAgeExclude:
  - '@standard-config/*'
  - '@typescript/*'
  - typescript

overrides:
  '@prettier/plugin-oxc': '-'

permissions:
  simple-git-hooks:
    build: true

strictPeerDependencies: true

trustPolicy: no-downgrade
